<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Quire 編輯器 — 文件庫</title>
<style>
  /* 零 CDN、零外链；與編輯器外殼同源設計語彙（無 emoji，功能性圖示）。 */
  :root {
    --ink: #1a1a1a; --paper: #f5f5f2; --card: #ffffff; --line: #e3e1da;
    --accent: #C43120; --muted: #77746c;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Source Serif Pro", "Noto Serif TC", "PMingLiU", serif;
         background: var(--paper); color: var(--ink); }
  header { display: flex; align-items: center; justify-content: space-between;
           padding: 14px 28px; border-bottom: 1px solid var(--line); background: var(--card); }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; }
  .brand .q { width: 26px; height: 26px; }
  main { max-width: 980px; margin: 0 auto; padding: 36px 24px 80px; }
  .actions { display: flex; flex-wrap: wrap; gap: 14px; margin-bottom: 10px; }
  .tile { width: 180px; min-height: 120px; background: var(--card); border: 1px solid var(--line);
          border-radius: 8px; padding: 16px; cursor: pointer; text-align: left;
          font: inherit; color: inherit; transition: box-shadow .15s, transform .15s; }
  .tile:hover { box-shadow: 0 4px 14px rgba(0,0,0,.08); transform: translateY(-1px); }
  .tile .ico { width: 34px; height: 34px; margin-bottom: 10px; }
  .tile .t { font-weight: 700; }
  .tile .d { color: var(--muted); font-size: 12px; margin-top: 4px; line-height: 1.5; }
  h2 { font-size: 15px; color: var(--muted); margin: 34px 0 12px; font-weight: 600;
       display: flex; align-items: center; justify-content: space-between; }
  h2 button { font: inherit; font-size: 12px; color: var(--muted); background: none;
              border: 1px solid var(--line); border-radius: 6px; padding: 3px 10px; cursor: pointer; }
  .rows { display: flex; flex-direction: column; gap: 6px; }
  .row { display: flex; align-items: center; gap: 12px; background: var(--card);
         border: 1px solid var(--line); border-radius: 8px; padding: 12px 16px; cursor: pointer; }
  .row:hover { box-shadow: 0 3px 10px rgba(0,0,0,.06); }
  .row .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .meta { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .row .rm { border: none; background: none; color: var(--muted); cursor: pointer; font-size: 14px;
             padding: 4px 8px; border-radius: 6px; }
  .row .rm:hover { color: var(--accent); background: #f6e9e7; }
  .empty { color: var(--muted); font-size: 13px; padding: 8px 2px; }
  .drop { margin-top: 26px; border: 1.5px dashed #c9c6bc; border-radius: 10px; padding: 22px;
          text-align: center; color: var(--muted); font-size: 13px; }
  .drop.on { border-color: var(--accent); color: var(--accent); background: #fbf3f1; }
  .privacy { margin-top: 30px; font-size: 12px; color: var(--muted); line-height: 1.7;
             border-top: 1px solid var(--line); padding-top: 14px; }
  .badge { display: inline-block; font-size: 11px; color: var(--muted); border: 1px solid var(--line);
           border-radius: 999px; padding: 1px 8px; margin-left: 8px; vertical-align: 2px; }
  input[type=file] { display: none; }
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg class="q" viewBox="0 0 64 64" aria-hidden="true">
      <path d="M8 4h40l12 12v44H8z" fill="#111"/>
      <path d="M48 4l12 12H48z" fill="#C43120"/>
      <path d="M40 40 L56 60" stroke="#fff" stroke-width="5" fill="none"/>
    </svg>
    Quire 編輯器<span class="badge">技術預覽</span>
  </div>
  <div style="font-size:12px;color:var(--muted)">文件存在你的瀏覽器本機，不上傳任何伺服器</div>
</header>

<main>
  <div class="actions">
    <button class="tile" id="btn-open">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.6" aria-hidden="true">
        <path d="M4 20 V4 h10 l6 6 v10"/><path d="M14 4 v6 h6"/>
      </svg>
      <div class="t">開啟檔案</div>
      <div class="d">DOCX／ODT。選檔後直接進編輯器。</div>
    </button>
    <button class="tile" id="btn-sample">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.6" aria-hidden="true">
        <path d="M5 4h14v16H5z"/><path d="M8 8h8M8 12h8M8 16h5"/>
      </svg>
      <div class="t">示範文件</div>
      <div class="d">內建樣本（含表格），試探編輯器能力面。</div>
    </button>
    <div class="tile" aria-disabled="true" style="opacity:.55;cursor:not-allowed">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="#777" stroke-width="1.6" aria-hidden="true">
        <path d="M4 4h16v16H4z"/><path d="M4 9h16M9 9v11"/>
      </svg>
      <div class="t">試紙<span class="badge">企劃中</span></div>
      <div class="d">試紙（Spreadsheet）工作區在路線圖上，尚未開放。</div>
    </div>
  </div>
  <div class="drop" id="drop">也可把檔案拖進此頁（DOCX／ODT）</div>

  <h2><span id="recent-title">最近</span><button id="btn-clear" hidden>清空紀錄</button></h2>
  <div class="rows" id="rows"><div class="empty">讀取中…</div></div>

  <div class="privacy">
    <strong>隱私設計：</strong>最近清單與檔案內容只存在<strong>本機瀏覽器</strong>的 IndexedDB（本裝置本瀏覽器可見），
    零上傳、零網路請求；引擎（WebAssembly）也在你的裝置上執行文件解析與排版。移除項目會真正刪除本機位元組，
    清空即歸零。本頁是技術預覽：能編輯的欄位以編輯器內「即時生效」標示為準，其餘為開發中。
  </div>
</main>

<input type="file" id="pick" accept=".docx,.odt" />
<script type="module">
import { listRecent, removeRecent, clearAll, getRecent, putPending } from './js/recent-store.js';

const rows = document.getElementById('rows');
const btnClear = document.getElementById('btn-clear');
const pick = document.getElementById('pick');

function fmtDate(ms) {
  const d = new Date(ms);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function fmtSize(n) { return n > 1048576 ? (n/1048576).toFixed(1)+' MB' : Math.max(1, Math.round(n/1024))+' KB'; }

async function render() {
  let items = [];
  try { items = await listRecent(20); }
  catch (e) { rows.innerHTML = '<div class="empty">此瀏覽器不支援本地儲存（最近清單不可用）。</div>'; return; }
  btnClear.hidden = items.length === 0;
  if (items.length === 0) { rows.innerHTML = '<div class="empty">還沒有開過的檔案。從上方「開啟檔案」或拖放開始。</div>'; return; }
  rows.innerHTML = '';
  for (const it of items) {
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#777" stroke-width="1.6" aria-hidden="true"><path d="M6 2h9l4 4v16H6z"/><path d="M15 2v4h4"/></svg>
      <span class="nm"></span><span class="meta">${fmtSize(it.size)} ・ ${fmtDate(it.openedAt)}</span>
      <button class="rm" title="從本機移除">移除</button>`;
    row.querySelector('.nm').textContent = it.name;
    row.addEventListener('click', async (ev) => {
      if (ev.target.classList.contains('rm')) { ev.stopPropagation(); await removeRecent(it.id); render(); return; }
      const rec = await getRecent(it.id);
      if (!rec || !rec.bytes) { render(); return; }
      await putPending(rec.bytes, rec.name);
      location.href = './word.html';
    });
    rows.appendChild(row);
  }
}
document.getElementById('btn-clear').addEventListener('click', async () => { await clearAll(); render(); });
document.getElementById('btn-open').addEventListener('click', () => pick.click());
document.getElementById('btn-sample').addEventListener('click', () => { location.href = './word.html?sample=1'; });
pick.addEventListener('change', async () => {
  const f = pick.files && pick.files[0];
  if (!f) return;
  await putPending(new Uint8Array(await f.arrayBuffer()), f.name);
  location.href = './word.html';
});
const drop = document.getElementById('drop');
['dragover','dragenter'].forEach(t => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.add('on'); }));
['dragleave','drop'].forEach(t => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.remove('on'); }));
drop.addEventListener('drop', async (e) => {
  const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
  if (!f) return;
  await putPending(new Uint8Array(await f.arrayBuffer()), f.name);
  location.href = './word.html';
});
render();
</script>
</body>
</html>
